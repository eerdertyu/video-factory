<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <title>HyperFrames animated background</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #080B14; }
    #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #080B14; }
    .orb { position: absolute; width: 850px; height: 850px; border-radius: 50%; filter: blur(90px); opacity: .28; will-change: transform; }
    #orb-a { left: -300px; top: 90px; background: radial-gradient(circle, #65E4FF 0%, #4263EB 35%, transparent 72%); }
    #orb-b { right: -360px; top: 650px; background: radial-gradient(circle, #B8FF5C 0%, #31B77A 35%, transparent 72%); opacity: .18; }
    #orb-c { left: -180px; bottom: -180px; background: radial-gradient(circle, #FF7C9C 0%, #8B5CF6 38%, transparent 72%); opacity: .18; }
    .grid { position: absolute; inset: 0; opacity: .08; background-image: linear-gradient(rgba(255,255,255,.25) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.25) 1px, transparent 1px); background-size: 72px 72px; }
    .grain { position: absolute; inset: 0; opacity: .08; background-image: url('data:image/svg+xml,%3Csvg viewBox=%220 0 180 180%22 xmlns=%22http://www.w3.org/2000/svg%22%3E%3Cfilter id=%22n%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%22.9%22 numOctaves=%223%22 stitchTiles=%22stitch%22/%3E%3C/filter%3E%3Crect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23n)%22 opacity=%22.55%22/%3E%3C/svg%3E'); }
    .ring { position: absolute; width: 700px; height: 700px; left: 190px; top: 610px; border: 2px solid rgba(101,228,255,.16); border-radius: 50%; transform: scale(.8); }
    .ring-inner { position: absolute; width: 520px; height: 520px; left: 280px; top: 700px; border: 2px solid rgba(184,255,92,.12); border-radius: 50%; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="hyperframes-background" data-start="0" data-duration="10" data-width="1080" data-height="1920">
    <div class="orb" id="orb-a"></div>
    <div class="orb" id="orb-b"></div>
    <div class="orb" id="orb-c"></div>
    <div class="ring" id="ring"></div>
    <div class="ring-inner" id="ring-inner"></div>
    <div class="grid"></div>
    <div class="grain"></div>
  </div>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    tl.to('#orb-a', { x: 260, y: 250, scale: 1.18, duration: 3, ease: 'sine.inOut' }, 0)
      .to('#orb-a', { x: -80, y: 520, scale: .92, duration: 3, ease: 'sine.inOut' }, 3)
      .to('#orb-a', { x: 0, y: 0, scale: 1, duration: 4, ease: 'sine.inOut' }, 6)
      .to('#orb-b', { x: -250, y: -180, scale: 1.2, duration: 5, ease: 'sine.inOut' }, 0)
      .to('#orb-b', { x: 0, y: 180, scale: .9, duration: 5, ease: 'sine.inOut' }, 5)
      .to('#orb-c', { x: 260, y: -220, scale: 1.15, duration: 5, ease: 'sine.inOut' }, 0)
      .to('#orb-c', { x: -100, y: 0, scale: .95, duration: 5, ease: 'sine.inOut' }, 5)
      .to('#ring', { rotation: 360, scale: 1.08, duration: 10, ease: 'none' }, 0)
      .to('#ring-inner', { rotation: -360, scale: .9, duration: 10, ease: 'none' }, 0);
    window.__timelines['hyperframes-background'] = tl;
  </script>
</body>
</html>
